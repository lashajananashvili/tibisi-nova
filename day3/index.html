<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6 Pictures Gallery</title>
    <style>
        body {
            text-align: center;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .gallery {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            max-width: 1000px;
            margin: 20px auto;
        }

        img {
            width: 100%;
            height: 250px;
            border-radius: 8px;
        }

        @media (min-width: 600px) {
            .gallery {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (min-width: 900px) {
            .gallery {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="gallery">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="Mountain">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="Forest">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="Beach">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="Desert">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="Aurora">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="Waterfall">
    </div>

</body>
</html>
